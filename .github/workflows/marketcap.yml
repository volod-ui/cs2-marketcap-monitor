```yaml
name: CS2 Steam Market Monitor

on:
  # Handmatig starten vanuit GitHub Actions
  workflow_dispatch:

  # Elke dag om 02:00, 10:00 en 18:00 Belgische tijd
  schedule:
    - cron: "7 2,10,18 * * *"
      timezone: "Europe/Brussels"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Repository ophalen
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python installeren
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------
      # Dependencies installeren
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # CS2 Steam Market Monitor uitvoeren
      # ------------------------------------------------------
      - name: Run market monitor
        env:
          PRICEMPIRE_API_KEY: ${{ secrets.PRICEMPIRE_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python bot.py

      # ------------------------------------------------------
      # State bewaren
      #
      # Dit zorgt ervoor dat state.json beschikbaar blijft
      # voor de volgende scan.
      # ------------------------------------------------------
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update CS2 market state"
            git push
          fi
```
