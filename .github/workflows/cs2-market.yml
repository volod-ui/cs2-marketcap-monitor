name: CS2 Steam Market Monitor
run-name: CS2 Market Scan — ${{ github.event_name }}

on:
  # Belgium time: 02:17, 10:17 and 18:17.
  # Staggered 10 minutes after crypto to reduce concurrent GitHub Actions load.
  schedule:
    - cron: "17 2,10,18 * * *"
      timezone: "Europe/Brussels"

  workflow_dispatch:
    inputs:
      force_run:
        description: "Run a live CS2 market scan now"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Run CS2 market monitor
        env:
          DISCORD_WEBHOOK_CSMARKET: ${{ secrets.DISCORD_WEBHOOK_CSMARKET }}
          FORCE_RUN: ${{ inputs.force_run || false }}
        run: |
          python cs2_market_monitor.py
