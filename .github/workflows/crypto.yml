name: Crypto Market Monitor

on:
  schedule:
    # Belgium time: 02:07, 10:07 and 18:07.
    # Staggered from the CS2 monitors to reduce concurrent GitHub Actions load.
    - cron: "7 2,10,18 * * *"
      timezone: "Europe/Brussels"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a live test message without changing saved history"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Run crypto monitor
        env:
          DISCORD_WEBHOOK_CRYPTO: ${{ secrets.DISCORD_WEBHOOK_CRYPTO }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CRYPTO_TEST_MODE: ${{ inputs.test_mode || false }}
        run: |
          python crypto_runner.py

      - name: Save crypto state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_state.json
          git diff --cached --quiet || git commit -m "Update crypto state"
          git push
