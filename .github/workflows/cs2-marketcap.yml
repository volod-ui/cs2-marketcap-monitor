name: CS2 Market Cap Monitor
run-name: CS2 Market Cap — ${{ github.event_name }}

on:
  # GitHub Actions uses UTC. The Python monitor enforces 02:00, 10:00 and 18:00 Brussels time.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run a live CS2 market-cap update now"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Run CS2 market-cap monitor
        env:
          DISCORD_WEBHOOK_CSMARKET: ${{ secrets.DISCORD_WEBHOOK_CSMARKET }}
          FORCE_RUN: ${{ inputs.force_run || false }}
        run: python cs2_marketcap_monitor.py
      - name: Save CS2 market-cap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs2_marketcap_state.json
          git diff --cached --quiet || git commit -m "Update CS2 market-cap state"
          git push
