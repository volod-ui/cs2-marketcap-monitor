name: CS2 News Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run CS2 News monitor
        env:
          DISCORD_WEBHOOK_CSNEWS: ${{ secrets.DISCORD_WEBHOOK_CSNEWS }}
        run: |
          python csnews_monitor.py

      - name: Save news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add csnews_state.json

          git diff --cached --quiet || git commit -m "Update CS2 news state"

          git push
