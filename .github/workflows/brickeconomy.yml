name: BrickEconomy Daily Monitor

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run BrickEconomy monitor
        env:
          DISCORD_WEBHOOK_BRICKECONOMY: ${{ secrets.DISCORD_WEBHOOK_BRICKECONOMY }}
        run: |
          python brickeconomy_monitor.py

      - name: Save BrickEconomy state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add brickeconomy_state.json

          git diff --cached --quiet || git commit -m "Update BrickEconomy state"

          git push
